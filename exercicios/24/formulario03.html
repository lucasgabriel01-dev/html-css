<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> Mais testes de formularios </h1>
    <form action="" method="post" autocomplete="on">
        <p>
            <label for="ialuno">nome:</label>
            <input type="text" name="aluno" id="ialuno" required placeholder="nome">
        </p>
        <p>
            <label for="imedia">media:</label>
            <input type="number" name="media" id="imedia" min="0" max="10" placeholder="media" step="0.1" value="5">
        </p>
        <p>
            <label for="imes">periodo letivo</label>
            <input type="month" name="mes" id="imes">
        </p>
        <p>
            <label for="idia">dia da prova:</label>
            <input type="date" name="dia" id="idia">
        </p>
        <p>
            <label for="ihora">hora da prova:</label>
            <input type="time" name="hora" id="ihora">
        </p>
        <p>
            <input type="reset" value="limpar">
            <input type="submit" value="enviar">
        </p>
        <button>p</button>
    </form>
</body>
</html>
