<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>sem input</h1>
    <p>
       <label for="iestados">Estados:</label>
       <select name="estados" id="iestados">
        <optgroup label="Regiao Sudeste">
            <option value="SP">Sao Paulo</option>
            <option value="RJ">Rio de Janeiro</option>
        </optgroup>
        <optgroup label="Regiao Nordeste">
            <option value="PE">Pernambuco</option>       
        </optgroup> 
        </select>
    </p>
    <p>
        <label for="iprof">profissao:</label>
        <input type="text" name="profissao" id="iprof" list="listprof">
        <datalist id="listprof">
            <option >adiministrador</option>
            <option >desemvolvedor</option>
        </datalist>
    </p>
    <p>
        <label for="inum">nivel:</label>
        <input type="range" name="num" id="inum" min="0" max="10" value="5" oninput=" ival.innerHTML= Number(inum.value)">
        <output id="ival">5</output>
    </p>
    <p>
        <input type="submit" value="enviar">
        <input type="reset" value="limpar">
    </p>
</body>
</html>
